<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no"
  >
  <title>Three-Student AR Exhibition</title>

  <!-- Import map: pins matching, tested versions of three.js and its addons -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- MindAR image tracking (ES module build, matches three@0.160 line) -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      touch-action: manipulation;
    }
    #ar-container {
      position: fixed;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    #interface {
      position: fixed;
      z-index: 10;
      inset: 0;
      pointer-events: none;
    }
    #header,
    #status-panel {
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
    }
    #header {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      padding: 14px;
    }
    #header h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }
    #header p {
      margin: 6px 0 0;
      color: #d0d0d0;
      font-size: 14px;
      line-height: 1.4;
    }
    #status-panel {
      position: absolute;
      right: 16px;
      bottom: 16px;
      left: 16px;
      padding: 14px;
      pointer-events: auto;
    }
    #status {
      margin: 0;
      font-size: 15px;
      line-height: 1.4;
    }
    #object-title {
      display: none;
      margin: 8px 0 0;
      color: #77dfff;
      font-size: 19px;
      line-height: 1.3;
    }
    #object-description {
      display: none;
      margin: 6px 0 0;
      color: #d0d0d0;
      font-size: 14px;
      line-height: 1.4;
    }
    #controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.13);
      color: #fff;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover,
    button:focus {
      outline: 2px solid #77dfff;
      outline-offset: 2px;
    }
    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    #start-screen,
    #error-screen,
    #fallback-screen {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.88);
      pointer-events: auto;
    }
    #start-screen button,
    #error-screen button,
    #fallback-screen button {
      position: relative;
      z-index: 101;
      width: 100%;
      pointer-events: auto;
    }
    .card {
      width: min(500px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      border-radius: 14px;
      background: #1e1e1e;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    .card h2 {
      margin-top: 0;
      line-height: 1.25;
    }
    .card p,
    .card li {
      color: #d0d0d0;
      line-height: 1.5;
    }
